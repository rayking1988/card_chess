<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a472a">
  <link rel="icon" type="image/png" href="/icon/icon-512.png">
  <title>Card Chess</title>
  <style>
    @font-face {
      font-family: 'BoldPixels';
      src: url('./font/BoldPixels.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Digital7';
      src: url('./font/digital-7.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a472a;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior: none;
      /* Prevent text selection */
      -webkit-user-select: none;
      user-select: none;
      /* Prevent touch callout */
      -webkit-touch-callout: none;
      /* Prevent tap highlight overlay */
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Safe area insets for notched devices */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Ensure canvas fills container properly */
    #game-container canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hidden element to preload fonts */
    .font-preload {
      position: absolute;
      left: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <!-- Preload fonts by rendering hidden text -->
  <div class="font-preload" style="font-family: 'Digital7';">0123456789:</div>
  <div class="font-preload" style="font-family: 'BoldPixels';">ABCabc</div>
  <div id="game-container"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
